<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <h1>Feedback</h1>

    <form>
        <label>Name:<sup>*</sup>
        <input type="text" placeholder="Ihr Name *" required>
        </label>

        <br>

        <label>E-Mail:<sup>*</sup>
            <input type="email" placeholder="Ihre E-Mail adresse*" required> <br>
            <small>*wird nicht öffentlich angezeigt* </small>
        </label>

        <br>

        <label>Inhalt:<sup>*</sup>
            <textarea name="Feedback" id="feedback" placeholder="Ihr Feedback" required></textarea>
        </label>

        <button type="submit" class="absenden">Absenden</button>
        <button type="submit" class="abbrechen">Abbrechen</button>
    </form>


    
</body>
</html>
